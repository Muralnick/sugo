# Signed, verifiable release pipeline (ADR-033, roadmap step 9), scoped to
# PyPI only for v0.1 — see ADR-033's 2026-11-04 amendment for what is
# deferred (Docker/GHCR, other channels, the mirror) and why.
#
# Triggered by pushing a stable version tag (vX.Y.Z); a pre-release tag
# such as v0.1.0a1 is excluded on purpose, since that one is published by
# hand (ADR-033, 2026-11-03 amendment). workflow_dispatch exists only to
# dry-run build, SBOM and attestation on a branch; it cannot publish, since
# that step requires a tag push.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Built twice, independently, so the reproducibility job below can catch
  # a build that isn't actually deterministic before it ships.
  build-a:
    name: build (a)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          enable-cache: true

      - name: Build sdist and wheel
        run: uv build --out-dir dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-a
          path: dist/

  build-b:
    name: build (b)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          enable-cache: true

      - name: Build sdist and wheel
        run: uv build --out-dir dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-b
          path: dist/

  reproducibility:
    name: reproducibility check
    needs: [build-a, build-b]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-a
          path: dist-a

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-b
          path: dist-b

      - name: Diff the two builds byte-for-byte
        run: diff -r dist-a dist-b

  sbom:
    name: generate SBOM
    needs: build-a
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          enable-cache: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-a
          path: dist

      - name: Install the lite extra into a release environment
        run: |
          uv venv .venv-release
          whl=$(ls dist/*.whl)
          uv pip install --python .venv-release "sugo-cli[lite] @ ${whl}"

      - name: Generate the CycloneDX SBOM
        run: |
          uv run python scripts/release/generate_sbom.py \
            "$(pwd)/.venv-release/bin/python" \
            "$(pwd)/dist/sbom.cdx.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: dist/sbom.cdx.json

  attest:
    name: Sigstore attestation
    needs: [reproducibility, sbom]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-a
          path: dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: dist

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*.whl,dist/*.tar.gz,dist/sbom.cdx.json"

  publish:
    name: publish to PyPI
    if: github.event_name == 'push'
    needs: attest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Requires a one-time, by-hand step on pypi.org: add this repository and
    # workflow as a Trusted Publisher for the sugo-cli project (ADR-033).
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-a
          path: dist

      - name: Drop the SBOM before publishing (PyPI accepts sdist/wheel only)
        run: rm -f dist/sbom.cdx.json

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
