# Signed, verifiable release pipeline (ADR-033, roadmap step 9), scoped to
# PyPI only for v0.1 — see ADR-033's 2026-11-04 amendment for what is
# deferred (Docker/GHCR, other channels, the mirror) and why.
#
# Triggered by pushing a stable version tag: vX.Y.Z for sugo-cli,
# langchain-sugo-vX.Y.Z and llama-index-readers-sugo-vX.Y.Z for the loaders
# (ADR-068). The target job checks that the tag's version is the project's.
# A pre-release tag such as v0.1.0a1 is excluded on purpose, since that one
# is published by hand (ADR-033, 2026-11-03 amendment). workflow_dispatch
# exists only to dry-run build, SBOM and attestation on a branch; it cannot
# publish, since that step requires a tag push.
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "langchain-sugo-v[0-9]+.[0-9]+.[0-9]+"
      - "llama-index-readers-sugo-v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      project:
        description: Project to dry-run
        type: choice
        options: [sugo-cli, langchain-sugo, llama-index-readers-sugo]
        default: sugo-cli

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Which project this run releases, from the tag (or the dry-run input).
  target:
    name: release target
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      directory: ${{ steps.pick.outputs.directory }}
      name: ${{ steps.pick.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: pick
        name: Check the tag against the project
        env:
          REF: ${{ github.event_name == 'push' && github.ref_name || inputs.project }}
        run: python3 scripts/release/release_target.py "$REF" >> "$GITHUB_OUTPUT"

  # Built twice, independently, so the reproducibility job below can catch
  # a build that isn't actually deterministic before it ships.
  build-a:
    name: build (a)
    needs: target
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          enable-cache: true

      # --no-sources: the loaders build against sugo-cli from PyPI, never
      # the copy in this repository.
      - name: Build sdist and wheel
        env:
          PROJECT_DIR: ${{ needs.target.outputs.directory }}
        run: uv build "$PROJECT_DIR" --no-sources --out-dir dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-a
          path: dist/

  build-b:
    name: build (b)
    needs: target
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          enable-cache: true

      # --no-sources: the loaders build against sugo-cli from PyPI, never
      # the copy in this repository.
      - name: Build sdist and wheel
        env:
          PROJECT_DIR: ${{ needs.target.outputs.directory }}
        run: uv build "$PROJECT_DIR" --no-sources --out-dir dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-b
          path: dist/

  reproducibility:
    name: reproducibility check
    needs: [build-a, build-b]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-a
          path: dist-a

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-b
          path: dist-b

      - name: Diff the two builds byte-for-byte
        run: diff -r dist-a dist-b

  sbom:
    name: generate SBOM
    needs: [target, build-a]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          enable-cache: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-a
          path: dist

      # A loader's dependencies, sugo-cli included, come from PyPI: release
      # sugo-cli first. The lite extra is empty since ADR-060.
      - name: Install the package into a release environment
        env:
          PROJECT_NAME: ${{ needs.target.outputs.name }}
        run: |
          uv venv .venv-release
          whl=$(ls dist/*.whl)
          uv pip install --python .venv-release "${PROJECT_NAME} @ ${whl}"

      - name: Generate the CycloneDX SBOM
        run: |
          uv run python scripts/release/generate_sbom.py \
            "$(pwd)/.venv-release/bin/python" \
            "$(pwd)/dist/sbom.cdx.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: dist/sbom.cdx.json

  attest:
    name: Sigstore attestation
    needs: [reproducibility, sbom]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-a
          path: dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: dist

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*.whl,dist/*.tar.gz,dist/sbom.cdx.json"

  publish:
    name: publish to PyPI
    if: github.event_name == 'push'
    needs: attest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Requires a one-time, by-hand step on pypi.org for each project
    # (sugo-cli, langchain-sugo, llama-index-readers-sugo): add this
    # repository, this workflow and the release environment as its Trusted
    # Publisher (ADR-033, ADR-068).
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-a
          path: dist

      - name: Drop the SBOM before publishing (PyPI accepts sdist/wheel only)
        run: rm -f dist/sbom.cdx.json

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
