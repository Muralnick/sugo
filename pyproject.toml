[project]
name = "sugo"
version = "0.0.0"
description = "Documents, reduced: local conversion of documents and screenshots into compact Markdown for LLMs and RAG."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.14.1,<3",
    "tiktoken>=0.14.0,<0.15",
]
classifiers = [
    "Development Status :: 1 - Planning",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
    # Blocks accidental uploads until the v0.1 release (roadmap step 9).
    "Private :: Do Not Upload",
]

[project.optional-dependencies]
# Engine levels are installed as extras (ADR-007). Image stack: ADR-039.
lite = [
    "numpy>=2.5.4,<3",
    "onnxruntime>=1.31.0,<2",
    "pillow>=12.3.0,<13",
    "rapidocr==3.10.0",
]

[dependency-groups]
# Development tools only; see ADR-035. Exact versions and hashes live in uv.lock.
dev = [
    # Tests exercise every level, so the dev environment installs its extras.
    "sugo[lite]",
    "hypothesis>=6.169.1",
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

# --- uv -------------------------------------------------------------------

[tool.uv]
# Relative durations in exclude-newer need uv 0.13 (ADR-035).
required-version = ">=0.13.0"
# Enforces the 14-day minimum age for every dependency (CLAUDE.md, ADR-035).
exclude-newer = "14 days"

[tool.uv.workspace]
# Official packs, each a separate distribution (ADR-032).
members = ["packs/*"]

# --- ruff -----------------------------------------------------------------

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",       # pycodestyle errors, incl. E722 bare except
    "W",       # pycodestyle warnings
    "F",       # pyflakes
    "I",       # import sorting
    "N",       # naming
    "B",       # bugbear
    "UP",      # modern syntax for the target version
    "S",       # security: eval, exec, pickle, shell=True, yaml.load, XML
    "T20",     # no print
    "BLE",     # no blind except
    "TID",     # banned imports (see banned-api below)
    "PT",      # pytest style
    "SIM",     # simplifications
    "RUF",     # ruff-specific
    "PLR2004", # no magic numbers: limits live in sugo/core/constants.py
    "D100",    # every module starts with a docstring
    "D104",    # every package starts with a docstring
]

[tool.ruff.lint.per-file-ignores]
# Tests assert and compare against literal expected values by design.
"tests/**" = ["S101", "PLR2004"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"pickle".msg = "Unsafe deserialization is forbidden (CODE_STYLE.md)."
"marshal".msg = "Unsafe deserialization is forbidden (CODE_STYLE.md)."
"shelve".msg = "Built on pickle; forbidden (CODE_STYLE.md)."
"xml.etree.ElementTree".msg = "Parse XML only with defusedxml (CLAUDE.md)."
"xml.etree.cElementTree".msg = "Parse XML only with defusedxml (CLAUDE.md)."
"xml.dom.minidom".msg = "Parse XML only with defusedxml (CLAUDE.md)."
"xml.dom.pulldom".msg = "Parse XML only with defusedxml (CLAUDE.md)."
"xml.dom.expatbuilder".msg = "Parse XML only with defusedxml (CLAUDE.md)."
"xml.sax".msg = "Parse XML only with defusedxml (CLAUDE.md)."
"xml.parsers.expat".msg = "Parse XML only with defusedxml (CLAUDE.md)."
# import-linter can only forbid whole top-level packages, and urllib.parse and
# http.HTTPStatus are harmless, so the client submodules are banned here
# (ADR-036). Only sugo._internal.net may import them, each with `# noqa: TID251`.
"urllib.request".msg = "Outbound access only through sugo._internal.net (ADR-036)."
"http.client".msg = "Outbound access only through sugo._internal.net (ADR-036)."

# --- mypy -----------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
# Type-checks pydantic model constructors (ships with pydantic, ADR-037).
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
mypy_path = "src"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
strict_equality = true

[[tool.mypy.overrides]]
# Strict typing where correctness matters most (CODE_STYLE.md, ADR-029).
# Add "sugo.security.*" when that package is created (warn_unused_configs).
module = ["sugo.core.*", "sugo.api.*", "sugo.metrics.*", "sugo.extractors.*", "sugo.cleaners.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_subclassing_any = true
warn_return_any = true
no_implicit_reexport = true
extra_checks = true

# --- pytest ---------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
filterwarnings = ["error"]
markers = [
    "invariant: enforces a principle in PRINCIPLES.md; never weaken or skip",
]

# --- import-linter --------------------------------------------------------

[tool.importlinter]
root_package = "sugo"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Core never imports ports"
type = "forbidden"
source_modules = ["sugo.core"]
forbidden_modules = ["sugo.ports"]

# Cleaners see only the IR and propose decisions; the core applies them (ADR-041).
# The gateway users are listed too: the network contracts below ignore their
# imports of the gateway, so a cleaner reaching them would get network access.
[[tool.importlinter.contracts]]
name = "Cleaners work on the IR only"
type = "forbidden"
source_modules = ["sugo.cleaners"]
forbidden_modules = [
    "sugo.extractors",
    "sugo.ports",
    "sugo.sources",
    "sugo.models",
    "sugo.setup",
    "sugo._internal.net",
]

# Network boundaries (ADR-036). Each contract ignores the imports made by the
# modules it allows, which also cuts indirect chains through them; unmatched
# ignores are expected until those packages exist.

[[tool.importlinter.contracts]]
name = "Internet client libraries only in the network gateway"
type = "forbidden"
source_modules = ["sugo"]
forbidden_modules = [
    # Standard library
    "ftplib",
    "imaplib",
    "poplib",
    "smtplib",
    "ssl",
    "xmlrpc",
    # Third-party clients
    "aiohttp",
    "httpx",
    "requests",
    "urllib3",
    "websockets",
]
ignore_imports = ["sugo._internal.net -> *", "sugo._internal.net.** -> *"]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "Local networking only in ports, engine and gateway"
type = "forbidden"
source_modules = ["sugo"]
forbidden_modules = ["http", "socket", "socketserver"]
ignore_imports = [
    "sugo.ports -> *",
    "sugo.ports.** -> *",
    "sugo.core.engine -> *",
    "sugo.core.engine.** -> *",
    "sugo._internal.net -> *",
    "sugo._internal.net.** -> *",
]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "Network gateway used only by sources, models and setup"
type = "forbidden"
# "sugo.*" rather than "sugo": import-linter skips a source module that
# contains the forbidden one. Known gap, left to review: the top-level
# sugo/__init__.py and other sugo._internal modules are not checked.
source_modules = ["sugo.*"]
forbidden_modules = ["sugo._internal.net"]
# A "*" target matches one name segment only, so the gateway is named in full.
ignore_imports = [
    "sugo.sources -> sugo._internal.net",
    "sugo.sources -> sugo._internal.net.**",
    "sugo.sources.** -> sugo._internal.net",
    "sugo.sources.** -> sugo._internal.net.**",
    "sugo.models -> sugo._internal.net",
    "sugo.models -> sugo._internal.net.**",
    "sugo.models.** -> sugo._internal.net",
    "sugo.models.** -> sugo._internal.net.**",
    "sugo.setup -> sugo._internal.net",
    "sugo.setup -> sugo._internal.net.**",
    "sugo.setup.** -> sugo._internal.net",
    "sugo.setup.** -> sugo._internal.net.**",
]
unmatched_ignore_imports_alerting = "none"
