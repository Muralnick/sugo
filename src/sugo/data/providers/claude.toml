# Image-token formula for Anthropic Claude (ADR-003). Data, not code: update this
# file when the provider changes its pricing, without a Sugo release.
schema_version = 1
provider = "claude"
default_tier = "standard"

[source]
description = "Anthropic vision documentation, as recorded in docs/ARCHITECTURE.md section 7"
checked = 2026-10-27
status = "verified"

# Tokens = ceil(w / 28) * ceil(h / 28) after resizing to the tier's long-edge limit.
[tiers.standard]
kind = "patches"
patch_size = 28
max_long_edge = 1568
max_tokens = 1568

[tiers.high_resolution]
kind = "patches"
patch_size = 28
max_long_edge = 2576
max_tokens = 4784
