# Image-token formulas for OpenAI vision models (ADR-003). Data, not code: update
# this file when the provider changes its pricing, without a Sugo release.
#
# Tier names are "<model family>-<detail level>". Patch-based tiers follow the
# "Model sizing behavior" table and the multiplier table; tile-based tiers follow
# "Tile-based image tokenization". Deprecated models (marked * in the
# documentation) are not listed, since they are not in the sizing table.
schema_version = 1
provider = "openai"
# The API default detail level is "auto".
default_tier = "gpt-6-astra-auto"

[source]
description = "OpenAI documentation: Images and vision, sections 'Model sizing behavior' and 'Calculating costs'"
url = "https://developers.openai.com/api/docs/guides/images-vision"
checked = 2026-10-28
status = "verified"

# --- gpt-6-astra (multiplier 1.2) ------------------------------------------

[tiers.gpt-6-astra-low]
kind = "budgeted_patches"
applies_to = ["gpt-6-astra, detail low"]
patch_size = 32
max_dimension = 512
max_patches = 30000
multiplier = 1.2

[tiers.gpt-6-astra-high]
kind = "budgeted_patches"
applies_to = ["gpt-6-astra, detail high"]
patch_size = 32
max_dimension = 65535
patch_budget = 2500
max_patches = 30000
multiplier = 1.2

[tiers.gpt-6-astra-original]
kind = "budgeted_patches"
applies_to = ["gpt-6-astra, detail original or auto"]
patch_size = 32
max_dimension = 65535
max_patches = 30000
multiplier = 1.2

# --- gpt-5.6-sol, gpt-5.6-terra, gpt-5.6-luna (multiplier 1.2) --------------

[tiers."gpt-5.6-low"]
kind = "budgeted_patches"
applies_to = ["gpt-5.6-sol, gpt-5.6-terra, gpt-5.6-luna, detail low"]
patch_size = 32
max_dimension = 512
max_patches = 30000
multiplier = 1.2

[tiers."gpt-5.6-high"]
kind = "budgeted_patches"
applies_to = ["gpt-5.6-sol, gpt-5.6-terra, gpt-5.6-luna, detail high"]
patch_size = 32
max_dimension = 2048
patch_budget = 2500
max_patches = 30000
multiplier = 1.2

[tiers."gpt-5.6-original"]
kind = "budgeted_patches"
applies_to = ["gpt-5.6-sol, gpt-5.6-terra, gpt-5.6-luna, detail original or auto"]
patch_size = 32
max_dimension = 65535
max_patches = 30000
multiplier = 1.2

# --- gpt-5.5 (multiplier 1.2) -----------------------------------------------

[tiers."gpt-5.5-low"]
kind = "budgeted_patches"
applies_to = ["gpt-5.5, detail low"]
patch_size = 32
max_dimension = 512
max_patches = 30000
multiplier = 1.2

[tiers."gpt-5.5-high"]
kind = "budgeted_patches"
applies_to = ["gpt-5.5, detail high"]
patch_size = 32
max_dimension = 2048
patch_budget = 2500
max_patches = 30000
multiplier = 1.2

[tiers."gpt-5.5-original"]
kind = "budgeted_patches"
applies_to = ["gpt-5.5, detail original or auto"]
patch_size = 32
max_dimension = 6000
patch_budget = 10000
max_patches = 30000
multiplier = 1.2

# --- gpt-5.4, gpt-5.4-mini, gpt-5.4-nano (multiplier 1.2) -------------------

[tiers."gpt-5.4-low"]
kind = "budgeted_patches"
applies_to = ["gpt-5.4, gpt-5.4-mini, gpt-5.4-nano, detail low"]
patch_size = 32
max_dimension = 2048
patch_budget = 6144
max_patches = 30000
multiplier = 1.2

[tiers."gpt-5.4-high"]
kind = "budgeted_patches"
applies_to = ["gpt-5.4, gpt-5.4-mini, gpt-5.4-nano, detail high or auto"]
patch_size = 32
max_dimension = 2048
patch_budget = 2500
max_patches = 30000
multiplier = 1.2

[tiers."gpt-5.4-original"]
kind = "budgeted_patches"
applies_to = ["gpt-5.4, gpt-5.4-mini, gpt-5.4-nano, detail original"]
