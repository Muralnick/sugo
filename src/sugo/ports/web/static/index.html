<!doctype html>
<html lang="$lang">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="sugo-data" content="$data">
<title>Sugo</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
<script src="/app.js" defer></script>
</head>
<body>
<header class="bar">
  <div class="bar-inner">
    <div class="brand">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
        <g class="logo-splat">
          <path d="M28.00 16.20C28.08 17.47 25.99 17.96 25.69 19.41C25.39 20.87 26.93 23.98 26.22 24.94C25.51 25.90 23.15 24.71 21.42 25.19C19.68 25.67 17.64 27.86 15.80 27.80C13.96 27.74 12.05 25.39 10.39 24.85C8.74 24.31 6.57 25.41 5.84 24.56C5.11 23.71 6.15 21.80 6.03 19.76C5.90 17.71 4.61 14.17 5.09 12.30C5.57 10.43 7.86 9.92 8.91 8.55C9.96 7.18 10.18 4.55 11.39 4.08C12.60 3.60 14.22 5.13 16.17 5.71C18.11 6.28 21.55 6.53 23.06 7.54C24.57 8.56 24.40 10.36 25.23 11.80C26.05 13.25 27.92 14.93 28.00 16.20Z"/>
          <circle cx="29.6" cy="4.6" r="1.5"/><circle cx="2.6" cy="26.4" r="1"/><circle cx="5.2" cy="4.4" r="0.7"/>
        </g>
        <path class="logo-s" transform="translate(15.8 16.2) scale(0.72) translate(-16 -16.2)" d="M21 10.2C20.3 8.3 18.4 7.2 16 7.2c-2.9 0-5 1.5-5 3.9 0 5.2 10 4 10 9.6 0 2.4-2.1 3.9-5 3.9-2.4 0-4.3-1-5-2.9"/>
      </svg>
      <span class="brand-name">Sugo</span>
    </div>
    <nav class="tabs" role="tablist">
      <button type="button" role="tab" id="tab-convert" aria-controls="view-convert" data-view="convert" data-text="tab_convert"></button>
      <button type="button" role="tab" id="tab-verify" aria-controls="view-verify" data-view="verify" data-text="tab_verify"></button>
      <button type="button" role="tab" id="tab-settings" aria-controls="view-settings" data-view="settings" data-text="tab_settings"></button>
      <button type="button" role="tab" id="tab-questions" aria-controls="view-questions" data-view="questions" data-text="tab_questions"></button>
    </nav>
  </div>
</header>

<main>
  <section id="view-convert" class="view" role="tabpanel" aria-labelledby="tab-convert">
    <p class="tagline" data-text="tagline"></p>

    <div id="drop" class="drop">
      <div class="drop-icon" aria-hidden="true"></div>
      <p class="drop-title" data-text="drop"></p>
      <div class="drop-actions">
        <label class="button primary">
          <span data-text="choose"></span>
          <input id="file" type="file" multiple accept=".pdf,.docx,.xlsx,.pptx,.png,.jpg,.jpeg,.webp,.xml">
        </label>
        <button id="paste" type="button" data-text="paste"></button>
      </div>
      <p class="muted small" data-text="paste_hint"></p>
      <p class="muted small" data-text="formats"></p>
      <p id="file-name" class="file-name"></p>
    </div>

    <div id="status" class="status" role="status" aria-live="polite">
      <span class="spinner" aria-hidden="true"></span>
      <span id="status-text"></span>
    </div>

    <section id="batch" class="panel" hidden>
      <div class="panel-head">
        <h2 id="batch-title"></h2>
        <button id="save-all" type="button" data-text="save_all" disabled></button>
      </div>
      <ol id="batch-list" class="batch-list"></ol>
    </section>

    <section id="error" class="error" role="alert" hidden>
      <p><strong id="error-code"></strong> <span id="error-message"></span></p>
      <p id="error-hint" class="muted"></p>
    </section>

    <section id="result" hidden>
      <div class="cards">
        <div class="card"><span class="card-label" data-text="tokens_before"></span><span id="card-before" class="card-value"></span></div>
        <div class="card"><span class="card-label" data-text="tokens_after"></span><span id="card-after" class="card-value"></span></div>
        <div class="card accent"><span class="card-label" data-text="tokens_saved"></span><span id="card-saved" class="card-value"></span></div>
        <div class="card"><span class="card-label" data-text="pages_label"></span><span id="card-pages" class="card-value"></span></div>
      </div>
      <div class="meter" aria-hidden="true"><div id="meter-after" class="meter-after"></div></div>
      <p id="text-savings" class="muted small"></p>
      <p id="failed" class="warning" hidden></p>

      <div class="columns">
        <div class="panel markdown-panel">
          <div class="panel-head">
            <h2 data-text="markdown"></h2>
            <div class="actions">
              <button id="copy" type="button" data-text="copy"></button>
              <button id="save" type="button" data-text="save"></button>
            </div>
          </div>
          <textarea id="markdown" readonly spellcheck="false"></textarea>
        </div>

        <div class="side">
          <div class="panel">
            <h2 data-text="removed_title"></h2>
            <ul id="removed" class="removed"></ul>
          </div>
          <div class="panel">
            <h2 data-text="edited_title"></h2>
            <ul id="edited" class="removed"></ul>
          </div>
          <div id="images-panel" class="panel" hidden>
            <h2 data-text="images_title"></h2>
            <table id="images">
              <thead>
                <tr>
                  <th data-text="provider"></th>
                  <th data-text="tier"></th>
                  <th class="number" data-text="image_tokens"></th>
                  <th class="number" data-text="markdown_tokens"></th>
                  <th class="number" data-text="saved"></th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>

      <div id="chunks-panel" class="panel" hidden>
        <div class="panel-head">
          <h2 data-text="chunks_title"></h2>
          <button id="save-jsonl" type="button" data-text="save_jsonl"></button>
        </div>
        <p id="chunks-count" class="muted small"></p>
        <ol id="chunks" class="chunks"></ol>
      </div>

      <div id="receipt-panel" class="panel" hidden>
        <div class="panel-head">
          <h2 data-text="receipt_title"></h2>
          <button id="save-receipt" type="button" data-text="save_receipt"></button>
        </div>
        <p class="muted small" data-text="receipt_intro"></p>
        <details id="receipt-removed" class="receipt-part">
          <summary></summary>
          <ol class="receipt-list"></ol>
        </details>
        <details id="receipt-edited" class="receipt-part">
          <summary></summary>
          <ol class="receipt-list"></ol>
        </details>
        <details id="receipt-flagged" class="receipt-part">
          <summary></summary>
          <ol class="receipt-list"></ol>
        </details>
      </div>
    </section>
  </section>

  <section id="view-verify" class="view" role="tabpanel" aria-labelledby="tab-verify" hidden>
    <p class="muted" data-text="verify_intro"></p>
    <div class="panel settings">
      <label class="field">
        <span class="field-label" data-text="verify_document"></span>
        <input id="verify-document" type="file" accept=".pdf,.docx,.xlsx,.pptx,.png,.jpg,.jpeg,.webp,.xml">
      </label>
      <label class="field">
        <span class="field-label" data-text="verify_receipt"></span>
        <input id="verify-receipt" type="file" accept=".json,application/json">
      </label>
      <button id="verify-run" type="button" data-text="verify_run"></button>
      <p id="verify-status" class="muted small" role="status" aria-live="polite"></p>
    </div>

    <section id="verify-error" class="error" role="alert" hidden>
      <p><strong id="verify-error-code"></strong> <span id="verify-error-message"></span></p>
      <p id="verify-error-hint" class="muted"></p>
    </section>

    <div id="verify-result" class="panel" hidden>
      <p id="verify-verdict" class="verdict"></p>
      <p id="verify-drifted" class="warning" data-text="verify_drifted" hidden></p>
      <ol id="verify-differences" class="receipt-list"></ol>
    </div>
  </section>

  <section id="view-settings" class="view" role="tabpanel" aria-labelledby="tab-settings" hidden>
    <p class="muted" data-text="settings_intro"></p>
    <div class="panel settings">
      <label class="field">
        <span class="field-label" data-text="ui_language"></span>
        <select id="ui-language">
          <option value="it" data-text="lang_it"></option>
          <option value="en" data-text="lang_en"></option>
        </select>
      </label>

      <fieldset class="field">
        <legend class="field-label" data-text="text_languages"></legend>
        <div id="text-languages" class="checks"></div>
        <p class="muted small" data-text="text_languages_help"></p>
      </fieldset>

      <label class="check">
        <input id="strip-tracking" type="checkbox">
        <span data-text="strip_tracking"></span>
      </label>

      <label class="check">
        <input id="make-chunks" type="checkbox">
        <span data-text="make_chunks"></span>
      </label>

      <label class="field">
        <span class="field-label" data-text="chunk_size"></span>
        <input id="chunk-tokens" type="number" step="1" inputmode="numeric">
      </label>

      <label class="check">
        <input id="make-receipt" type="checkbox">
        <span data-text="make_receipt"></span>
      </label>

      <label class="check">
        <input id="keep-cache" type="checkbox">
        <span data-text="keep_cache"></span>
      </label>
      <p id="cache-off-config" class="muted small" data-text="cache_off_config" hidden></p>

      <button id="reset" type="button" data-text="reset"></button>
    </div>

    <div class="panel settings">
      <div class="panel-head">
        <h2 data-text="doctor_title"></h2>
        <button id="doctor" type="button" data-text="doctor_run"></button>
      </div>
      <p id="doctor-status" class="muted small" role="status" aria-live="polite"></p>
      <table id="doctor-checks" hidden>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <section id="view-questions" class="view" role="tabpanel" aria-labelledby="tab-questions" hidden>
    <div id="questions" class="questions"></div>
  </section>

  <footer class="muted small" data-text="local_only"></footer>
</main>
</body>
</html>
